@if (!isAuthenticated()) {
  <app-login />
} @else if (loading() && !hasTeam()) {
  <div class="loading-shell">
    <app-logo class="pulse" variant="mark" [size]="72" aria-hidden="true" />
    <span>{{ 'app.loading' | transloco }}</span>
  </div>
} @else if (!hasTeam()) {
  <app-team-setup />
} @else {
  <div class="app-shell">
    <app-dashboard-header />

    <div class="app-body">
      <app-leaderboard-sidebar class="sidebar" />
      <main class="main-content">
        <router-outlet />
      </main>
    </div>
  </div>
}

@if (updateReady()) {
  <div class="update-banner" role="status">
    <span>{{ 'app.updateReady' | transloco }}</span>
    <button type="button" (click)="reload()">{{ 'app.reload' | transloco }}</button>
  </div>
}
