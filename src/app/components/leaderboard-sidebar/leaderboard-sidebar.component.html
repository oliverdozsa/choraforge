<aside class="leaderboard" aria-labelledby="leaderboard-title">
  <div class="panel-head">
    <h2 id="leaderboard-title" class="panel-title">Leaderboard</h2>
    <span class="panel-scope">All time</span>
  </div>
  <ol class="rank-list">
    <li
      *ngFor="let member of rankedMembers(); let i = index"
      class="rank-row"
      [class.self]="member.userId === currentUserId()"
      [style.--h]="avatarHue(member.userId)"
    >
      <span class="rank-badge" [ngClass]="rankClass(i + 1)"><span>{{ i + 1 }}</span></span>
      <span class="avatar" aria-hidden="true">{{ member.name.charAt(0) }}</span>
      <div class="name-block">
        <span class="name">
          {{ member.name }}
          <span class="you-tag" *ngIf="member.userId === currentUserId()">YOU</span>
        </span>
        <div class="level-line">
          <span class="level">Lv {{ member.level }}</span>
          <span class="level-bar" [style.--p]="levelProgress(member) + '%'"></span>
        </div>
      </div>
      <span class="gold-cell">
        <span class="gold" [attr.aria-label]="member.gold + ' gold'">{{ member.gold }}</span>
        <button
          *ngIf="isTeamAdmin()"
          type="button"
          class="edit-gold"
          title="Edit gold"
          [attr.aria-label]="'Edit gold for ' + member.name"
          (click)="openGoldEditor(member)"
        >
          ✎
        </button>
        <button
          *ngIf="canChangeRole(member)"
          type="button"
          class="edit-gold"
          title="Change role"
          [attr.aria-label]="'Change role for ' + member.name"
          (click)="openRoleEditor(member)"
        >
          ⚑
        </button>
      </span>
    </li>
  </ol>
</aside>

<app-dialog *ngIf="editingMember() as member" [title]="'Edit gold: ' + member.name" (closed)="closeGoldEditor()">
  <form class="gold-form" (ngSubmit)="saveGold()">
    <label>
      Gold
      <input type="number" name="gold" min="0" step="1" [(ngModel)]="goldInput" autocomplete="off" />
    </label>
    <p class="form-error" *ngIf="formError()">{{ formError() }}</p>
    <button type="submit" class="save-btn" [disabled]="saving()">{{ saving() ? 'Saving…' : 'Save' }}</button>
  </form>
</app-dialog>

<app-dialog *ngIf="roleMember() as member" [title]="'Change role: ' + member.name" (closed)="closeRoleEditor()">
  <form class="gold-form" (ngSubmit)="saveRole()">
    <label>
      Role
      <select name="role" [(ngModel)]="roleInput">
        <option value="USER">USER</option>
        <option value="ADMIN">ADMIN</option>
      </select>
    </label>
    <p class="form-error" *ngIf="formError()">{{ formError() }}</p>
    <button type="submit" class="save-btn" [disabled]="saving()">{{ saving() ? 'Saving…' : 'Save' }}</button>
  </form>
</app-dialog>
