<ng-container *transloco="let t">
<div class="designer">
  <form class="designer-form" (ngSubmit)="onSubmit()">
    <label *ngIf="templates.length && !initial">
      {{ t('designer.startFromTemplate') }} <span class="optional">({{ t('common.optional') }})</span>
      <select name="templateId" [(ngModel)]="selectedTemplateId" [ngModelOptions]="{standalone: true}" (ngModelChange)="onTemplateSelected()">
        <option value="">{{ t('designer.blankCard') }}</option>
        <option *ngFor="let template of templates" [value]="template.id">{{ template.title }}</option>
      </select>
    </label>

    <label>
      {{ t('designer.title') }}
      <input type="text" name="title" [(ngModel)]="title" required maxlength="80" />
    </label>

    <label>
      {{ t('designer.description') }}
      <textarea name="description" [(ngModel)]="description" rows="2" maxlength="200"></textarea>
    </label>

    <label>
      {{ t('designer.rarity') }}
      <select name="rarity" [(ngModel)]="rarity">
        <option *ngFor="let r of rarities" [value]="r">{{ t('enums.rarity.' + r) }}</option>
      </select>
    </label>

    <div class="field-row">
      <label>
        {{ t('designer.complexity') }}
        <input type="number" name="complexity" [(ngModel)]="complexity" min="1" max="10" />
      </label>
      <label>
        {{ t('designer.minutes') }}
        <input type="number" name="estimatedMinutes" [(ngModel)]="estimatedMinutes" min="1" />
      </label>
    </div>

    <div class="field-row">
      <label>
        {{ t('designer.xpReward') }}
        <input type="number" name="xpReward" [(ngModel)]="xpReward" min="0" />
      </label>
      <label>
        {{ t('designer.goldReward') }}
        <input type="number" name="goldReward" [(ngModel)]="goldReward" min="0" />
      </label>
    </div>

    <label>
      {{ t('designer.itemDrop') }} <span class="optional">({{ t('common.optional') }})</span>
      <input type="text" name="itemDrop" [(ngModel)]="itemDrop" maxlength="60" />
    </label>

    <label>
      {{ t('designer.imageUrl') }} <span class="optional">({{ t('designer.imageTip') }})</span>
      <input type="url" name="imageUrl" [(ngModel)]="imageUrl" maxlength="500" placeholder="https://…" />
    </label>

    <label *ngFor="let member of members">
      {{ t('designer.memberImageUrl', { name: member.name }) }} <span class="optional">({{ t('common.optional') }})</span>
      <input type="url" [name]="'userImageUrl-' + member.userId" [(ngModel)]="userImageUrls[member.userId]" maxlength="500" placeholder="https://…" />
    </label>

    <label class="checkbox-label">
      <input type="checkbox" name="hasDueDate" [(ngModel)]="hasDueDate" />
      {{ t('designer.setDueDate') }}
    </label>

    <div class="field-row" *ngIf="hasDueDate">
      <label>
        {{ t('designer.dueIn') }}
        <input type="number" name="dueDateAmount" [(ngModel)]="dueDateAmount" min="1" />
      </label>
      <label>
        {{ t('designer.unit.label') }}
        <select name="dueDateUnit" [(ngModel)]="dueDateUnit">
          <option *ngFor="let u of dueDateUnits" [value]="u.value">{{ t(u.label) }}</option>
        </select>
      </label>
    </div>

    <label>
      {{ t('designer.recurrence.label') }}
      <select name="recurrenceType" [(ngModel)]="recurrenceType">
        <option *ngFor="let rt of recurrenceTypes" [value]="rt.value">{{ t(rt.label) }}</option>
      </select>
    </label>

    <label *ngIf="recurrenceType === 'AFTER_COMPLETION'">
      {{ t('designer.respawnAfter') }}
      <input type="number" name="intervalMinutes" [(ngModel)]="intervalMinutes" min="1" />
    </label>

    <ng-container *ngIf="recurrenceType === 'SCHEDULE'">
      <div class="field-row">
        <label>
          {{ t('designer.frequency') }}
          <select name="frequency" [(ngModel)]="frequency">
            <option *ngFor="let f of frequencies" [value]="f">{{ t('enums.frequency.' + f) }}</option>
          </select>
        </label>
        <label>
          {{ t('designer.everyN') }}
          <input type="number" name="scheduleInterval" [(ngModel)]="scheduleInterval" min="1" max="100" />
        </label>
      </div>

      <div class="weekdays" *ngIf="frequency === 'WEEKLY'">
        <button
          type="button"
          *ngFor="let day of weekDays"
          class="day-chip"
          [class.active]="daysOfWeek.includes(day)"
          (click)="toggleDay(day)"
        >{{ t('enums.weekdayShort.' + day) }}</button>
      </div>

      <label *ngIf="frequency === 'MONTHLY'">
        {{ t('designer.dayOfMonth') }}
        <input type="number" name="dayOfMonth" [(ngModel)]="dayOfMonth" min="1" max="31" />
      </label>

      <div class="field-row">
        <label>
          {{ t('designer.time') }}
          <input type="time" name="time" [(ngModel)]="time" />
        </label>
        <label>
          {{ t('designer.timeZone') }}
          <input type="text" name="timeZone" [(ngModel)]="timeZone" />
        </label>
      </div>
    </ng-container>

    <p class="form-error" *ngIf="formError">{{ t(formError) }}</p>

    <div class="designer-actions">
      <button type="button" class="cancel-btn" (click)="onCancel()" [disabled]="submitting">{{ t('common.cancel') }}</button>
      <button type="submit" class="save-btn" [disabled]="submitting">
        {{ submitting ? t('common.saving') : t(submitLabel) }}
      </button>
    </div>
  </form>

  <div class="designer-preview">
    <app-chore-card [card]="previewCard" [readonlyCard]="true" />
  </div>
</div>
</ng-container>
