<header class="dash-header">
  <div class="identity">
    <div class="avatar-menu-anchor">
      <button type="button" class="avatar-btn" (click)="toggleAvatarMenu()" title="Account menu" aria-haspopup="true" [attr.aria-expanded]="avatarMenuOpen()">
        <div class="avatar" *ngIf="!profile()?.picture">{{ (user()?.name ?? '?').charAt(0) }}</div>
        <img class="avatar-img" *ngIf="profile()?.picture as pic" [src]="pic" alt="" />
      </button>

      <div class="avatar-menu-backdrop" *ngIf="avatarMenuOpen()" (click)="closeAvatarMenu()"></div>
      <div class="avatar-menu" *ngIf="avatarMenuOpen()">
        <button type="button" class="avatar-menu-item" (click)="openProfileDialog()">👤 My Profile</button>
        <button type="button" class="avatar-menu-item" (click)="openNewTeamDialog()">👥 Team</button>
      </div>
    </div>
    <div class="name-block">
      <span class="username">{{ user()?.name }}</span>
      <select
        *ngIf="teams().length > 1; else singleTeamName"
        class="team-select"
        [ngModel]="membership()?.teamId"
        (ngModelChange)="onTeamChange($event)"
      >
        <option *ngFor="let t of teams()" [value]="t.teamId">{{ t.teamName }}</option>
      </select>
      <ng-template #singleTeamName>
        <span class="team-name">{{ membership()?.teamName }}</span>
      </ng-template>
    </div>
  </div>

  <div class="level-block">
    <div class="level-tag">Lv. {{ membership()?.level ?? 1 }}</div>
    <div class="xp-bar-track">
      <div class="xp-bar-fill" [style.width.%]="xpProgressPercent()"></div>
      <span class="xp-bar-label">{{ membership()?.currentXp ?? 0 }} / {{ membership()?.nextLevelXp ?? 0 }} XP</span>
    </div>
  </div>

  <div class="header-actions">
    <div class="gold-counter">
      <span class="gold-icon">◈</span>
      <span class="gold-value">{{ membership()?.gold ?? 0 }}</span>
    </div>
    <button class="logout-btn" (click)="logout()" title="Sign out">⏻</button>
  </div>
</header>

@if (profileDialogOpen()) {
  <app-profile-dialog (closed)="closeProfileDialog()" />
}

@if (newTeamDialogOpen()) {
  <app-dialog title="Team" (closed)="closeNewTeamDialog()">
    <app-team-setup [embedded]="true" (completed)="closeNewTeamDialog()" />
  </app-dialog>
}
