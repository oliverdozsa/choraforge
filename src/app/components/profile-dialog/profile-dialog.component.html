<app-dialog title="My Profile" (closed)="closed.emit()">
  <div class="profile-identity">
    <div class="avatar" *ngIf="!profile()?.picture">{{ (user()?.name ?? '?').charAt(0) }}</div>
    <img class="avatar-img" *ngIf="profile()?.picture as pic" [src]="pic" alt="" />
    <div class="identity-text">
      <span class="name">{{ user()?.name }}</span>
      <span class="email">{{ user()?.email }}</span>
    </div>
  </div>

  <h3 class="teams-heading">My Teams</h3>
  <ul class="team-list">
    <li *ngFor="let t of teams()" class="team-row" [class.active]="t.teamId === selectedTeamId()">
      <div class="team-row-main">
        <span class="team-name">{{ t.teamName }}</span>
        <span class="team-role">{{ t.role }}</span>
      </div>
      <div class="team-row-stats">
        <span class="stat">Lv. {{ t.level }}</span>
        <span class="stat">{{ t.currentXp }}/{{ t.nextLevelXp }} XP</span>
        <span class="stat gold">◈ {{ t.gold }}</span>
      </div>
      <button
        type="button"
        class="switch-btn"
        *ngIf="t.teamId !== selectedTeamId()"
        (click)="switchTeam(t.teamId)"
      >
        Switch
      </button>
      <span class="current-tag" *ngIf="t.teamId === selectedTeamId()">Current</span>
    </li>
  </ul>
</app-dialog>
