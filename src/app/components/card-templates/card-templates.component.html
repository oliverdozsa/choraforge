<section class="templates-panel" *ngIf="isTeamAdmin()">
  <div class="section-heading">
    <h2>Card Templates</h2>
    <span class="count-badge">{{ templates().length }}</span>
  </div>

  <div class="template-grid">
    <app-chore-card
      *ngFor="let template of templates()"
      [card]="asChoreCard(template)"
      [readonlyCard]="true"
      [canEdit]="true"
      (edit)="startEditing(template.id)"
    />

    <button class="add-slot" *ngIf="!creating()" (click)="startCreating()">
      <span class="plus">+</span>
      <span>New Template</span>
    </button>
  </div>

  <app-card-designer-modal
    *ngIf="creating()"
    submitLabel="Save Template"
    [submitting]="submitting()"
    [previewTeamId]="selectedTeamId() ?? ''"
    (save)="save($event)"
    (cancelled)="cancel()"
  />

  <app-card-designer-modal
    *ngIf="editingTemplate() as template"
    submitLabel="Save Changes"
    [submitting]="editingSubmitting()"
    [previewTeamId]="selectedTeamId() ?? ''"
    [initial]="asDraft(template)"
    (save)="saveEdited($event)"
    (cancelled)="cancelEditing()"
  />
</section>
