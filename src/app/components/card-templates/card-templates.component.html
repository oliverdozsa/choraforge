<ng-container *transloco="let t">
<section class="templates-panel" *ngIf="isTeamAdmin()">
  <a class="back-link" routerLink="/">← {{ t('templates.back') }}</a>
  <div class="section-heading">
    <h2>{{ t('templates.title') }}</h2>
    <span class="count-badge">{{ templates().length }}</span>
  </div>

  <div class="template-grid">
    @for (template of templates(); track template.id) {
      <app-chore-card
        [card]="asChoreCard(template)"
        [readonlyCard]="true"
        [canEdit]="true"
        [canDelete]="true"
        (edit)="startEditing(template.id)"
        (delete)="startDeleting(template.id)"
      />
    }

    <button class="add-slot" *ngIf="!creating()" (click)="startCreating()">
      <span class="plus">+</span>
      <span>{{ t('templates.new') }}</span>
    </button>
  </div>

  <app-card-designer-modal
    *ngIf="creating()"
    submitLabel="designer.saveTemplate"
    [submitting]="submitting()"
    [previewTeamId]="selectedTeamId() ?? ''"
    [members]="members()"
    (save)="save($event)"
    (cancelled)="cancel()"
  />

  <app-card-designer-modal
    *ngIf="editingTemplate() as template"
    submitLabel="designer.saveChanges"
    [submitting]="editingSubmitting()"
    [previewTeamId]="selectedTeamId() ?? ''"
    [members]="members()"
    [initial]="asDraft(template)"
    (save)="saveEdited($event)"
    (cancelled)="cancelEditing()"
  />

  <app-confirm-dialog
    *ngIf="deletingTemplate() as template"
    [title]="t('templates.deleteTitle')"
    [message]="t('templates.deleteMessage', { title: template.title })"
    [confirming]="deletingSubmitting()"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDeleting()"
  />
</section>
</ng-container>
