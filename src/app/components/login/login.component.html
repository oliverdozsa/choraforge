<div class="login-shell">
  <div class="login-card">
    <div class="crest"><app-logo variant="mark" [size]="96" aria-hidden="true" /></div>
    <h1 class="brand">ChoraForge</h1>
    <p class="tagline">{{ 'login.tagline' | transloco }}</p>

    <div class="button-host" #buttonHost></div>

    <div class="login-lang"><app-language-switcher /></div>

    @if (notice(); as n) {
      <p class="sdk-error" role="alert">{{ (n === 'expired' ? 'login.sessionExpired' : 'login.signInFailed') | transloco }}</p>
    }

    @if (sdkError()) {
      <p class="sdk-error">{{ 'login.sdkError' | transloco }}</p>
    }

    @if (isDevMode) {
      <div class="dev-login">
        <p class="dev-label">Dev sign-in</p>
        <div class="dev-row">
          <input
            type="email"
            placeholder="dev@example.com"
            [(ngModel)]="devEmail"
            (keydown.enter)="loginAsDevUser()"
          />
          <button type="button" (click)="loginAsDevUser()">Sign in as dev user</button>
        </div>
      </div>
    }
  </div>
</div>
